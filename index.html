<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>download by Tip | TikTok Downloader Aesthetic</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #060210 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8a2be2, #4a00e0);
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
        }
        body::before { top: 10%; left: 10%; }
        body::after { bottom: 10%; right: 10%; }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            border-radius: 24px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ff007f, #7928ca, #b800ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: #a0aec0;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #7928ca;
            box-shadow: 0 0 15px rgba(121, 40, 202, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #7928ca, #ff007f);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        button:disabled {
            background: #4a5568;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Tampilan Kotak Hasil Mewah */
        .result-box {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.04);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .video-title {
            font-size: 1rem;

            margin-bottom: 8px;

        }

        .video-author {
            font-size: 0.85rem;

            margin-bottom: 15px;
        }

        .download-btn {
            background: linear-gradient(45deg, #00b4d8, #0077b6);
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
            display: block;
            width: 100%;
            text-decoration: none;
            text-align: center;
            border-radius: 14px;
            padding: 16px;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .download-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.5);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #718096;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>download by Tip</h1>
        <p class="subtitle">Download video TikTok tanpa watermark dengan cepat dan mudah</p>
        
        <div class="input-group">
            <input type="text" id="tiktokUrl" placeholder="Tempel tautan video TikTok di sini..." required>
            <button id="btnAction" onclick="prosesUnduhVideo()">Mulai Unduh</button>
        </div>

        <!-- Tampilan Hasil Internal Mandiri -->
        <div class="result-box" id="resultBox">
            <div class="video-card">
                <p class="video-title" id="resTitle">Memproses Video...</p>
                <p class="video-author" id="resAuthor">@user</p>
                <a href="#" id="finalDownloadLink" class="download-btn" target="_blank">Simpan Video Tanpa Watermark</a>
            </div>
        </div>

        <footer>
            &copy; 2026 download by Tip. Dibuat dengan penuh gaya.
        </footer>
    </div>

    <script>
        async function prosesUnduhVideo() {
            const inputField = document.getElementById('tiktokUrl');
            const actionBtn = document.getElementById('btnAction');
            const resultArea = document.getElementById('resultBox');
            let urlTarget = inputField.value.trim();

            if (!urlTarget) {
                alert('Tolong masukkan link TikTok terlebih dahulu!');
                return;
            }

            actionBtn.disabled = true;
            actionBtn.innerText = "Mengambil Video...";
            resultArea.style.display = "none";

            // Bersihkan parameter link yang tidak penting
            if (urlTarget.includes('?')) {
                urlTarget = urlTarget.split('?')[0];
            }

            try {
                // Menggunakan API pihak ketiga terkuat dan stabil khusus video TikTok
                const response = await fetch(`https://tikwm.com{encodeURIComponent(urlTarget)}`);
                const result = await response.json();

                if (result && result.data) {
                    const videoData = result.data;

                    // Masukkan data hasil ke elemen HTML internal web Anda
                    document.getElementById('resTitle').innerText = videoData.title || "Video Berhasil Ditemukan!";
                    document.getElementById('resAuthor').innerText = `Oleh: @${videoData.author.unique_id || "Kreator"}`;
                    
                    // Pasang link download asli video tanpa watermark (.mp4) ke tombol
                    const downloadAnchor = document.getElementById('finalDownloadLink');
                    downloadAnchor.href = videoData.play;

                    // Tampilkan kotak hasil yang keren
                    resultArea.style.display = "block";
                } else {
                    alert('Gagal memproses link tersebut. Pastikan videonya publik (tidak di-private).');
                }
            } catch (err) {
                alert('Terjadi sedikit gangguan jalur data. Silakan tekan tombol sekali lagi!');
            } finally {
                actionBtn.disabled = false;
                actionBtn.innerText = "Mulai Unduh";
            }
        }
    </script>
</body>
</html>
