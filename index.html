        * {

            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {

<body>

    <div class="container">
        <h1>download by Tip</h1>
        <p class="subtitle">Download video TikTok tanpa watermark dengan cepat dan mudah</p>
        
        <form class="input-group" onsubmit="ambilVideoTiktok(event)">
            <input type="text" id="tiktokUrl" placeholder="Tempel tautan video TikTok di sini..." required>
            <button type="submit" id="btnAction" class="btn-submit">Mulai Unduh</button>
        </form>

        <!-- Hasil Tampilan Tetap Di Sini, Nggak Lempar Ke Web Lain -->
        <div class="result-box" id="resultBox">
            <div class="video-card">
                <p class="video-title" id="resTitle">Memproses Video...</p>
                <p class="video-author" id="resAuthor">@user</p>
                <a href="#" id="finalDownloadLink" class="download-btn" target="_blank">Download Tanpa Watermark</a>
            </div>
        </div>

        <footer>
            &copy; 2026 download by Tip. Dibuat dengan penuh gaya.
        </footer>
    </div>

    <script>
        async function ambilVideoTiktok(event) {
            event.preventDefault();

            const inputField = document.getElementById('tiktokUrl');
            const actionBtn = document.getElementById('btnAction');
            const resultArea = document.getElementById('resultBox');
            let urlTarget = inputField.value.trim();

            if (!urlTarget) return;

            actionBtn.disabled = true;
            actionBtn.innerText = "Mengekstrak Video...";
            resultArea.style.display = "none";

            try {
                // Menggunakan API khusus dengan reverse-proxy tangguh untuk menghindari pemblokiran browser HP
                const res = await fetch("https://allorigins.win" + encodeURIComponent("https://tikwm.com" + urlTarget));
                if (!res.ok) throw new Error();
                
                const wrapperData = await res.json();
                const cleanJson = JSON.parse(wrapperData.contents);

                if (cleanJson && cleanJson.data && cleanJson.data.play) {
                    // Update teks nama & pembuat video di dalam website-mu
                    document.getElementById('resTitle').innerText = cleanJson.data.title || "Video TikTok Sukses Diproses!";
                    document.getElementById('resAuthor').innerText = `@${cleanJson.data.author.unique_id || "kreator"}`;
                    
                    // Masukkan link file video mentah (.mp4) ke dalam tombol internal
                    const downloadAnchor = document.getElementById('finalDownloadLink');
                    downloadAnchor.href = cleanJson.data.play;

                    // Munculkan secara estetik di bawah form tanpa pindah website
                    resultArea.style.display = "block";
                } else {
                    alert("Gagal memproses tautan video. Coba pastikan video tidak di-private!");
                }
            } catch (err) {
                alert("Jalur data sibuk, silakan klik tombol 'Mulai Unduh' sekali lagi untuk memuat ulang!");
            } finally {
                actionBtn.disabled = false;
                actionBtn.innerText = "Mulai Unduh";
            }
        }
    </script>
