<!DOCTYPE html>

<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #060210 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before, body::after {

            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8a2be2, #4a00e0);

        }
        body::before { top: 10%; left: 10%; }
        body::after { bottom: 10%; right: 10%; }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            border-radius: 24px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ff007f, #7928ca, #b800ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: #a0aec0;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #7928ca;
            box-shadow: 0 0 15px rgba(121, 40, 202, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #7928ca, #ff007f);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;

            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        button:disabled {
            background: #4a5568;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Bagian Hasil Unduhan Internal */
        .result-box {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);

        }

        .video-card {

        .video-author {

        }

        .download-btn {
            background: linear-gradient(45deg, #00b4d8, #0077b6);
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
            display: inline-block;
            width: 100%;
            text-decoration: none;
            text-align: center;
            border-radius: 14px;
            padding: 16px;

            transition: all 0.3s;
        }
        
        .download-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.5);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;

        }
    </style>
</head>
<body>

    <div class="container">
        <h1>download by Tip</h1>
        <p class="subtitle">Download video TikTok tanpa watermark dengan cepat dan mudah</p>
        
        <div class="input-group">
            <input type="text" id="tiktokUrl" placeholder="Tempel tautan video TikTok di sini..." required>
            <button id="btnAction" onclick="startDownload()">Mulai Unduh</button>
        </div>

        <!-- Tampilan Hasil yang akan muncul di bawah tombol asli -->
        <div class="result-box" id="resultBox">
            <div class="video-card">
                <p class="video-title" id="resTitle">Memuat Judul...</p>
                <p class="video-author" id="resAuthor">@user</p>
            </div>
            <a href="#" id="finalDownloadLink" class="download-btn" download="tiktok-video.mp4">Simpan Video Ke Galeri</a>
        </div>

        <footer>
            &copy; 2026 download by Tip. Dibuat dengan penuh gaya.
        </footer>
    </div>

    <script>
        async function startDownload() {
            const inputField = document.getElementById('tiktokUrl');
            const actionBtn = document.getElementById('btnAction');
            const resultArea = document.getElementById('resultBox');
            const urlTarget = inputField.value.trim();

            if (!urlTarget) {
                alert('Tolong masukkan link TikTok terlebih dahulu!');
                return;
            }

            // Kunci tombol saat sedang memproses agar tidak ditekan berkali-kali
            actionBtn.disabled = true;
            actionBtn.innerText = "Sedang Memproses...";
            resultArea.style.display = "none";

            try {
                // MENGGUNAKAN GLOBAL BYPASS PROXY: Menjamin bebas eror CORS lintas domain di semua browser HP
                const cleanUrl = urlTarget.split('?')[0];
                const proxyUrl = "https://allorigins.win" + encodeURIComponent("https://tikwm.com" + cleanUrl);
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error();
                
                const rawData = await response.json();
                const tikData = JSON.parse(rawData.contents);

                if (tikData && tikData.data) {
                    const videoInfo = tikData.data;

                    // Mengisi info video ke dalam website download by Tip Anda
                    document.getElementById('resTitle').innerText = videoInfo.title || "Video TikTok Tanpa Watermark";
                    document.getElementById('resAuthor').innerText = `@${videoInfo.author.unique_id || "tiktok_user"}`;
                    
                    // Memasukkan link download asli video bersih ke tombol download internal
                    const downloadAnchor = document.getElementById('finalDownloadLink');
                    downloadAnchor.href = videoInfo.play;
                    
                    // Tampilkan kotak unduhan internal Anda
                    resultArea.style.display = "block";
                } else {
                    alert('Gagal mengekstrak video. Pastikan video tidak diprivat dan link benar.');
                }

            } catch (err) {
                alert('Terjadi kendala jaringan server. Silakan klik tombol sekali lagi untuk memuat ulang.');
            } finally {
                // Kembalikan tombol ke keadaan aktif semula
                actionBtn.disabled = false;
                actionBtn.innerText = "Mulai Unduh";
            }
        }
    </script>
</body>
