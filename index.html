<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #060210 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8a2be2, #4a00e0);
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
        }
        body::before { top: 10%; left: 10%; }
        body::after { bottom: 10%; right: 10%; }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            border-radius: 24px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ff007f, #7928ca, #b800ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: #a0aec0;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Form Menggunakan Tag Form Resmi Agar Tombol HP Pasti Bisa Diklik */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #7928ca;
            box-shadow: 0 0 15px rgba(121, 40, 202, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #7928ca, #ff007f);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        /* Bagian Kotak Hasil seperti di Snaptik */
        .result-box {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.04);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .video-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .video-author {
            font-size: 0.85rem;
            color: #00f2fe;
            margin-bottom: 15px;
        }

        .download-btn {
            background: linear-gradient(45deg, #00b4d8, #0077b6);
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
            display: block;
            width: 100%;
            text-decoration: none;
            text-align: center;
            border-radius: 14px;
            padding: 16px;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .download-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.5);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #718096;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>download by Tip</h1>
        <p class="subtitle">Download video TikTok tanpa watermark dengan cepat dan mudah</p>
        
        <!-- Form resmi yang mencegah bug tombol tidak bisa ditekan di peramban HP -->
        <form class="input-group" onsubmit="prosesDataTiktok(event)">
            <input type="text" id="tiktokUrl" placeholder="Tempel tautan video TikTok di sini..." required>
            <button type="submit" id="btnAction" class="btn-submit">Mulai Unduh</button>
        </form>

        <!-- Tempat memunculkan data & tombol unduh persis seperti Snaptik -->
        <div class="result-box" id="resultBox">
            <div class="video-card">
                <p class="video-title" id="resTitle">Memproses Video...</p>
                <p class="video-author" id="resAuthor">@user</p>
                <a href="#" id="finalDownloadLink" class="download-btn" rel="noreferrer">Download Tanpa Watermark</a>
            </div>
        </div>

        <footer>
            &copy; 2026 download by Tip. Dibuat dengan penuh gaya.
        </footer>
    </div>

    <script>
        async function prosesDataTiktok(event) {
            // Mencegah browser melakukan refresh halaman otomatis
            event.preventDefault();

            const inputField = document.getElementById('tiktokUrl');
            const actionBtn = document.getElementById('btnAction');
            const resultArea = document.getElementById('resultBox');
            let urlTarget = inputField.value.trim();

            if (!urlTarget) return;

            // Mengubah status tombol menjadi loading
            actionBtn.disabled = true;
            actionBtn.innerText = "Mengambil data...";
            resultArea.style.display = "none";

            try {
                // Mengirim permintaan ke endpoint API pengurai video Tiktok yang tangguh
                const response = await fetch("https://eu.org" + encodeURIComponent(urlTarget));
                const jsonResult = await response.json();

                if (jsonResult && jsonResult.video && jsonResult.video.noWatermark) {
                    // Isi judul video dan username pembuatnya
                    document.getElementById('resTitle').innerText = jsonResult.title || "Video Berhasil Diambil!";
                    document.getElementById('resAuthor').innerText = jsonResult.author ? `@${jsonResult.author.uniqueId}` : "@kreator";
                    
                    // Masukkan link download mp4 tanpa watermark langsung ke tombol
                    const downloadAnchor = document.getElementById('finalDownloadLink');
                    downloadAnchor.href = jsonResult.video.noWatermark;

                    // Tampilkan kotak unduhan internal ala Snaptik ke layar web Anda sendiri
                    resultArea.style.display = "block";
                } else {
                    alert("Tautan salah atau video privat. Coba gunakan tautan video TikTok lainnya!");
                }
            } catch (err) {
                // Menggunakan server cadangan terkuat jika jalur utama sibuk
                try {
                    const altRes = await fetch("https://tikwm.com" + encodeURIComponent(urlTarget));
                    const altJson = await altRes.json();
                    if(altJson && altJson.data) {
                        document.getElementById('resTitle').innerText = altJson.data.title || "Video Berhasil Diambil!";
                        document.getElementById('resAuthor').innerText = `@${altJson.data.author.unique_id}`;
                        document.getElementById('finalDownloadLink').href = altJson.data.play;
                        resultArea.style.display = "block";
                        return;
                    }
                } catch(e) {}
                alert("Jaringan sibuk, silakan klik tombol 'Mulai Unduh' sekali lagi.");
            } finally {
                // Mengembalikan tombol agar siap digunakan kembali
                actionBtn.disabled = false;
                actionBtn.innerText = "Mulai Unduh";
            }
        }
    </script>
</body>
